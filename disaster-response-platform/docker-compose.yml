version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: disaster_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: disaster_redis
    ports:
      - "6379:6379"

  backend_api:
    build: ./backend
    container_name: disaster_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/disaster-response
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=prod_secret
      - JWT_REFRESH_SECRET=prod_refresh
      - FRONTEND_URL=http://localhost
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend/uploads:/app/uploads

  frontend_ui:
    build: ./frontend
    container_name: disaster_frontend
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend_api

  nginx_proxy:
    image: nginx:alpine
    container_name: disaster_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend_api
      - frontend_ui

volumes:
  mongo_data:
